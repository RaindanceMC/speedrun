id: manhunt
title: Manhunt
summary: Runners against Hunters — pick a side, how a hunt is won, and what happens when you are caught.
intro: |
  A few people run. Everybody else chases them with a compass and bad intentions. Splendid, honestly.
icon: TARGET
category: Games
order: 20
module: speedrun
aliases: [hunt, hunter, hunters, runner, runners, manhunt-start, sides]
keywords: [runner, hunter, caught, side, join, leave, status, hunt, lives, win]
commands: [manhunt]
related: [manhunt-compasses, manhunt-rules, manhunt-stats, speedrun]
sections:
  - question: How does Manhunt work?
    title: The idea
    text: |
      A hunt is a speedrun with sides. <green>Runners</green> race for the goal{if:speedrun:advancement-key} (<white>{setting:speedrun:advancement-key|name}</white>){/if}; <red>Hunters</red> chase them. The Runners win by reaching the goal; the Hunters win once every Runner is caught. {if:speedrun:game-mode == manhunt}The lobby is playing Manhunt right now.{else}The lobby is currently set to another game; staff switch it to Manhunt (or {cmd:/manhunt start} does it for them).{/if}
      Open {run:/manhunt} for the hub: the sides, the status and everything below on one page.
  - question: How do I pick a side?
    title: Picking a side
    text: |
      {cmd:/manhunt join runner} or {cmd:/manhunt join hunter}. {if:speedrun-manhunt:runner-self-join}Anybody may run.{else}Only an admin picks the Runners on this server; everybody else hunts.{/if} Nobody on a side hunts by default. {cmd:/manhunt leave} takes you off the Runners. Needs <white>rainsmanhunt.manhunt.use</white>, which everybody has.
  - question: Can I change sides during a hunt?
    title: Switching
    text: |
      {if:speedrun-manhunt:side-switching-mid-hunt}Yes: a Runner who gives up becomes a Hunter with a compass, and a Hunter who takes up the chase loses theirs.{else}No: once the clock starts the sides are fixed and only an admin can move anybody. They are yours to pick again after the hunt. {cmd:/manhunt leave} still takes you out of the hunt entirely, carrying none of its compasses.{/if}
  - question: How do I see how it stands?
    title: Status
    text: |
      {cmd:/manhunt status} says who is running, who hunts, how many Runners are still free, how many were caught. During a hunt a sidebar shows the Runners (hearts, where they are, caught or offline) and how many Hunters are online, plus your own role{if:speedrun-manhunt:runner-lives > 1} and lives left{/if}.
  - question: How is a Runner caught?
    title: Getting caught
    text: |
      {if:speedrun-manhunt:runner-lives == 1}One death catches a Runner.{else}A Runner is caught after dying <white>{setting:speedrun-manhunt:runner-lives|count}</white> times; until then they respawn and run on, and everybody is told how many lives are left.{/if} A Runner who stays logged out{if:speedrun-manhunt:runner-offline-grace-seconds > 0} longer than {setting:speedrun-manhunt:runner-offline-grace-seconds|seconds} counts as caught too — coming back in time costs nothing{else} is never caught for being away{/if}. Hunters may stay away as long as they like; the hunt goes on without them. The last Runner caught ends it as the Hunters' win.
  - question: What happens when I am caught?
    title: After the catch
    text: |
      Out of the hunt for good: you watch. Hunters who die respawn{if:speedrun-manhunt:hunter-respawn-delay-seconds > 0} and stand still for {setting:speedrun-manhunt:hunter-respawn-delay-seconds|seconds} before rejoining the chase{/if}. Everybody gets a summary at the end{if:speedrun-manhunt:summary-in-chat}, in chat, with a button to the full page{/if}.
  - question: What if I join a hunt that has started?
    title: Latecomers
    text: |
      That depends on the lobby's late-join setting (now <white>{setting:speedrun:late-join}</white>). With RACE you join the side {if:speedrun-manhunt:late-joiner-side == HUNTER}of the Hunters, never the Runners{/if}{if:speedrun-manhunt:late-joiner-side == RUNNER}of the Runners{/if}{if:speedrun-manhunt:late-joiner-side == SMALLER_SIDE}that has fewer players (a tie goes to the Hunters){/if}, with the usual lives and offline grace. While a hunt keeps the whitelist closed, nobody new gets in at all.
  - question: Can I show others where I am?
    title: Sharing position
    text: |
      {cmd:/manhunt here} tells your side where you are — the world and coordinates, with a button that shows the way; the clicker is guided until they arrive or type {cmd:/manhunt here stop}.
