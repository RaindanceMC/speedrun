id: manhunt-compasses
title: Hunt compasses
summary: The Hunters' tracker, the team compass, the Runners' structure compass and the particle trail.
intro: |
  Compasses that point at players, structures or teammates.
icon: COMPASS
category: Games
order: 21
module: speedrun
aliases: [compass, tracker, trail, structure-compass, team-compass]
keywords: [tracker, needle, nearest, portal, dimension, particles, structure, recovery, lost]
related: [manhunt, manhunt-rules]
sections:
  - question: What does the Hunters' compass do?
    title: The tracker
    text: |
      Every Hunter is handed a tracking compass. {if:speedrun-manhunt:tracker-hunter-may-choose}Right-click cycles it to the next Runner (or the nearest){else}It follows whoever is nearest{/if}. It is re-aimed every {setting:speedrun-manhunt:tracker-refresh-ticks|ticks}.{if:speedrun-manhunt:tracker-show-distance} Holding it shows how many blocks away the Runner is.{/if}
  - question: What if a Runner is elsewhere?
    title: Across dimensions
    text: |
      {if:speedrun-manhunt:tracker-cross-world == LAST_PORTAL}The needle points at the door the Runner went through, which is in your own world.{/if}{if:speedrun-manhunt:tracker-cross-world == NAME_WORLD}The compass only names the world they are in.{/if}{if:speedrun-manhunt:tracker-cross-world == HIDDEN}It shows nothing.{/if}
  - question: What is the particle trail?
    title: Trail
    when: speedrun-manhunt:tracker-particle-trail
    text: |
      A dotted line of particles that leads towards the Runner or door the compass points at. Only the Hunter holding the compass sees it. {cmd:/manhunt trail} turns it off and on for you.
  - question: Do Runners get a compass?
    title: Runner compasses
    text: |
      {if:speedrun-manhunt:runner-compass}Yes: a compass that points at the Hunters, the nearest or one they pick.{else}No tracking compass for Runners.{/if}{if:speedrun-manhunt:runner-structure-compass} Every Runner also gets one <white>structure compass</white> per hunt: right-click it to choose a kind of structure. You can choose once, and never a stronghold. It finds the nearest one and shows no distance. It disappears when you throw it away or come within 20 blocks of the structure.{/if}
  - question: What is the team compass?
    title: Team compass
    when: speedrun-manhunt:tracker-team-compass
    text: |
      Everybody in a hunt gets a second compass that points at their own side (Runners at Runners, Hunters at Hunters) in every dimension. It is a {setting:speedrun-manhunt:tracker-team-compass-item}. Right-click cycles through teammates; Sneak and right-click opens a list.
  - question: I lost my compass. What now?
    title: Lost compasses
    text: |
      They are bound to you, so they do not drop when you die. If one is still missing, ask an admin. {cmd:/manhunt give <player>} gives back whatever you lack, and nothing is pushed out of a full inventory.
